<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin Panel — CreditIQ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f6f1;color:#1a2e1e;min-height:100vh}
header{background:linear-gradient(135deg,#0a4d2e,#1a7a45);color:#fff;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(10,77,46,.2)}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.brand h1{font-size:20px;font-weight:800}
.nav{display:flex;align-items:center;gap:10px}
.nav a{color:#fff;text-decoration:none;font-size:13px;padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.25);transition:all .2s}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav .badge{background:#c9a84c;color:#1a2e1e;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:800;margin-left:6px}
.container{max-width:1200px;margin:0 auto;padding:28px 32px}
.page-title{font-size:22px;font-weight:800;color:#0a4d2e;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(10,77,46,.07);text-align:center;border:1px solid #e0ede3;transition:transform .2s;animation:fadeIn .4s ease}
.stat:hover{transform:translateY(-3px)}
.stat .val{font-size:32px;font-weight:800;color:#0a4d2e}
.stat .lbl{font-size:12px;color:#6b9e77;margin-top:4px;font-weight:600}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(10,77,46,.07);padding:24px;margin-bottom:24px;border:1px solid #e0ede3;animation:fadeIn .4s ease}
.card h2{font-size:16px;font-weight:700;color:#0a4d2e;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #e8f5eb;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f0f9f3;color:#4a8c5c;font-weight:700;padding:11px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{padding:11px 14px;border-bottom:1px solid #eef6f0;color:#1a2e1e}
tr:hover td{background:#f7fbf8}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.admin{background:#dcfce7;color:#15803d}
.pill.user{background:#f0f9f3;color:#4a8c5c}
.del-btn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.del-btn:hover{background:#fee2e2;transform:scale(1.02)}
.empty{text-align:center;color:#9ab89f;padding:36px;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="ico">&#127968;</div>
    <h1>CreditIQ <span style="opacity:.7;font-weight:400;font-size:14px">Admin Panel</span></h1>
  </div>
  <div class="nav">
    <span style="color:#f5d97a;font-size:13px">&#128100; {{ username }} <span class="badge">ADMIN</span></span>
    <a href="/">&#127968; App</a>
    <a href="/logout">&#128682; Logout</a>
  </div>
</header>

<div class="container">
  <div class="page-title">&#9881; Admin Dashboard</div>

  <div class="stats-grid">
    <div class="stat"><div class="val" id="sTotalUsers">—</div><div class="lbl">Total Users</div></div>
    <div class="stat"><div class="val" id="sTotalPred">—</div><div class="lbl">Total Predictions</div></div>
    <div class="stat"><div class="val" id="sApproved" style="color:#15803d">—</div><div class="lbl">Approved</div></div>
    <div class="stat"><div class="val" id="sRate">—</div><div class="lbl">Approval Rate</div></div>
  </div>

  <div class="card">
    <h2>&#128100; User Management</h2>
    <div id="usersWrap"><div class="empty">Loading users...</div></div>
  </div>
</div>

<script>
async function loadUsers(){
  const res=await fetch('/api/admin/users');
  const data=await res.json();
  document.getElementById('sTotalUsers').textContent=data.data.length;
  if(!data.data.length){document.getElementById('usersWrap').innerHTML='<div class="empty">No users found.</div>';return;}
  const rows=data.data.map(u=>`
    <tr>
      <td>${u.id}</td>
      <td><b>${u.name}</b></td>
      <td>${u.username}</td>
      <td>${u.email}</td>
      <td><span class="pill ${u.is_admin?'admin':'user'}">${u.is_admin?'Admin':'User'}</span></td>
      <td><b>${u.total_predictions}</b></td>
      <td style="color:#9ab89f;font-size:12px">${u.created_at||'—'}</td>
      <td>${u.is_admin?'<span style="color:#9ab89f;font-size:12px">Protected</span>':`<button class="del-btn" onclick="deleteUser(${u.id},'${u.username}')">&#128465; Delete</button>`}</td>
    </tr>`).join('');
  document.getElementById('usersWrap').innerHTML=`
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Predictions</th><th>Joined</th><th>Action</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function loadStats(){
  const res=await fetch('/api/admin/stats');
  const data=await res.json();
  const s=data.data;
  document.getElementById('sTotalPred').textContent=s.total;
  document.getElementById('sApproved').textContent=s.approved;
  document.getElementById('sRate').textContent=s.approval_rate+'%';
}

async function deleteUser(id,username){
  if(!confirm(`Delete user "${username}" and all their data?`)) return;
  const res=await fetch(`/api/admin/users/${id}`,{method:'DELETE'});
  const data=await res.json();
  if(data.success){loadUsers();loadStats();}
  else alert(data.error);
}

loadUsers(); loadStats();
</script>
</body>
</html>
